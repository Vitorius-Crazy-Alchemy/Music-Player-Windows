<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="128" height="128">
  <defs>
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#2979FF"/>
    </linearGradient>
  </defs>

  <!-- Headphones band -->
  <path d="M8.5,5.5 C8.5,3.5 10,2 12,2 C14,2 15.5,3.5 15.5,5.5" 
        stroke="#00E5FF" stroke-width="1.3" stroke-linecap="round" fill="none" filter="url(#neon-glow)"/>

  <!-- Earcups -->
  <path d="M7.5,5 h1.5 v3 h-1.5 Z M15,5 h1.5 v3 h-1.5 Z" 
        fill="#00E5FF" filter="url(#neon-glow)"/>

  <!-- Head -->
  <circle cx="12" cy="4.5" r="2.2" fill="#00E5FF" filter="url(#neon-glow)"/>

  <!-- Body (Dancing pose) -->
  <path d="M12,7 L12,13 M12,8.5 L16,6 M12,8.5 L7,10 M12,13 L9,17 L10,21 M12,13 L15,16 L14,21" 
        stroke="#00E5FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#neon-glow)"/>

  <!-- Cyber Pink Music notes -->
  <path d="M19,4 L19,2 L21,2 M19,4 A1,1 0 1,1 18.99,4 Z M4,6 L4,4 L6,4 M4,6 A1,1 0 1,1 3.99,6 Z" 
        fill="#FF4081" filter="url(#neon-glow)"/>
</svg>
